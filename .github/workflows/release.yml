name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - name: Version must come from the tag, not be a dev build
        run: "! ls dist | grep -E '\\.dev|\\+'"
      - run: uvx twine check dist/*
      - run: uv publish
