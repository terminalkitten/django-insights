[tox]
requires = tox>=4.22
envlist =
    py311-django52
    py312-django{52,60,61}
    py313-django{52,60,61}
    py314-django{52,60,61}

[testenv]
runner = uv-venv-runner
package = wheel
extras = pdf
wheel_build_env = .pkg
deps =
    pytest
    pytest-django
    pytest-cov
    faker
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    python -W error::ResourceWarning -W error::DeprecationWarning -W error::PendingDeprecationWarning -m pytest {posargs:tests}
setenv =
    PYTHONDEVMODE=1
