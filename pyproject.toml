[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-insights"
description = "Create insights for your Django app, written right next to your application logic"
authors = [{ name = "DK", email = "dk@terminalkitten.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Matplotlib",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]

[dependency-groups]
dev = ["django-insights[pdf]", "pytest", "pytest-django", "ruff", "ty", "django-stubs", "faker", "tox", "tox-uv"]
docs = ["mkdocs", "mkdocs-material"]

[project.urls]
Home = "https://github.com/terminalkitten/django-insights"

[tool.setuptools.packages.find]
include = ["django_insights*"]

[tool.setuptools_scm]

[[tool.ty.overrides]]
include = ["django_insights/models.py"]

[tool.ty.overrides.rules]
invalid-attribute-override = "ignore"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["django_insights/migrations", "project/testapp/migrations", "project/testapp/users/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["error", "ignore:Overriding setting DATABASES:UserWarning"]
addopts = """\
    --strict-config
    --strict-markers
    --ds=project.settings.test
    """
django_find_project = false
